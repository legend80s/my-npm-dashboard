<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>包排行榜 - my-npm-dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/closed-npm.svg" />
    <link rel="stylesheet" href="index.css" />
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "chart.js": "https://esm.sh/chart.js@4.5.1"
        }
      }
    </script>
    <style>
      body {
        padding: 20px;
        max-width: 1600px;
        margin: 0 auto;
      }
      .insight-header {
        position: sticky;
        top: 0;
        backdrop-filter: blur(8px);
        border-radius: 0.25rem;
        padding: 0.625rem 0.625rem 0.625rem 0;

        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .insight-header h1 {
        font-size: 1.25rem;
        color: var(--text-heading);
        margin-inline: auto;
      }

      .back-link {
        font-size: 0.875rem;
        font-family: var(--system-font);
        color: var(--accent);
      }

      .toggle-all {
        font-size: 0.75rem;
        padding: 0.3rem 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-emphasis);
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s;
      }
      .toggle-all:hover {
        border-color: var(--accent);
        color: var(--text);
      }

      .insight-layout {
        display: grid;
        grid-template-columns: 8rem 1fr;
        gap: 1.5rem;
        align-items: start;
      }

      .side-nav {
        position: sticky;
        top: 3rem;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        font-size: 0.8rem;
        font-family: var(--system-font);
      }
      .side-nav a {
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        color: var(--text-muted);
        text-decoration: none;
        transition: all 0.15s;
        /* border-left: 2px solid transparent; */
      }
      .side-nav a:hover {
        color: var(--text);
        background: var(--bg-emphasis);
      }
      .side-nav a.active {
        color: var(--accent);
        border-left-color: var(--accent);
        background: var(--bg-emphasis);
      }

      .insight-main {
        min-width: 0;
        margin-bottom: 14rem;
      }

      .section {
        margin: 0 auto 1.5rem;
        background: var(--bg-subtle);
        border-radius: 12px;
        overflow: hidden;
        outline: 2px solid transparent;
        transition: outline-color 0.3s;
        scroll-margin-top: 20px;
      }
      .section.flash {
        outline-color: var(--accent-green);
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.8rem 1rem;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .section-header:hover {
        background: var(--bg-emphasis);
      }
      .section-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-heading);
        white-space: nowrap;
      }
      .section-champ {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .section-champ strong {
        color: var(--text);
      }
      .section-chevron {
        margin-left: auto;
        color: var(--text-muted);
        transition: transform 0.2s;
      }
      .section.collapsed .section-chevron {
        transform: rotate(-90deg);
      }
      .section-body {
        border-top: 1px solid var(--border-muted);
      }
      .section.collapsed .section-body {
        display: none;
      }

      .hero {
        padding: 1rem 1.5rem 1.2rem;
      }
      .hero-rank {
        /* font-size: 0.75rem; */
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .hero-name {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-heading);
        margin-bottom: 0.5rem;
      }
      .hero-name a {
        color: inherit;
        text-decoration: none;
      }
      .hero-name a:hover {
        text-decoration: underline;
      }
      .hero-primary {
        font-size: 1.1rem;
        font-family: Georgia, serif;
        color: var(--accent-green);
        margin-bottom: 0.618rem;
      }
      .hero-description {
        font-size: 75%;
        font-family: var(--system-font);
      }
      .hero-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1.2rem;
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .hero-metrics span {
        white-space: nowrap;
      }
      .hero-metrics strong {
        color: var(--text);
      }

      .chart-wrap {
        height: 12rem;
        margin: 0 1.5rem 1.5rem;
      }
      .chart-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .status-msg {
        margin: 2rem auto;
        text-align: center;
        color: var(--text-muted);
        font-size: 1rem;
      }
      .status-msg .big {
        font-size: 3rem;
        display: block;
        margin-bottom: 1rem;
      }

      @media (max-width: 768px) {
        .insight-layout {
          grid-template-columns: 1fr;
        }
        .side-nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="insight-header">
      <a
        class="back-link"
        href="/"
        onclick="
          history.back();
          return false;
        "
        title="回到仪表板"
        >← 返回仪表板</a
      >
      <h1>
        📊 包排行榜 · <span id="insightUsername" class="text-primary">-</span>
      </h1>
      <button class="toggle-all" id="toggleAllBtn" type="button">
        全部收起
      </button>
    </div>

    <div class="insight-layout">
      <nav class="side-nav" id="sideNav"></nav>
      <main class="insight-main" id="sections"></main>
    </div>

    <div class="status-msg" id="statusMsg" style="display: none"></div>

    <script type="module" src="./insight.js"></script>
  </body>
</html>
