<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My npm Dashboard</title>
    <!-- description -->
    <meta
      name="description"
      content="pkg-marmot: Your own npm packages download dashboard"
    />
    <!-- keywords -->
    <meta
      name="keywords"
      content="pkg-marmot, npm, dashboard, packages, download"
    />
    <!-- author -->
    <meta name="author" content="legend80s" />

    <!-- favicon -->
    <!-- <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🐿️</text></svg>"
    /> -->

    <link rel="icon" type="image/svg+xml" href="/npm.svg" />

    <!-- "beautiful-mermaid": "https://unpkg.com/beautiful-mermaid@1.1.3/dist/index.js" -->
    <script type="importmap">
      {
        "imports": {
          "chart.js": "https://esm.sh/chart.js@4.5.1"
        }
      }
    </script>

    <script type="module" src="web-components/simple-counter/index.js"></script>
    <!-- hottest-trend-pkg -->
    <!-- <script
      type="module"
      src="web-components/hottest-trend-pkg/index.js"
    ></script> -->
    <!-- most-downloaded-pkg -->
    <!-- <script type="module" src="web-components/most-downloaded-pkg/index.js"></script> -->

    <link rel="stylesheet" href="index.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>

  <body>
    <!-- ===== HEADER ===== -->
    <div
      style="
        display: flex;
        justify-content: end;
        align-items: center;
        font-size: 0.75rem;
        gap: 0.5rem;
        margin-bottom: 1rem;
      "
    >
      <button
        type="button"
        class="btn btn-sm"
        id="refreshBtn"
        title="强制刷新数据（忽略缓存）"
      >
        🔄 刷新
      </button>
      <div class="stat-item" style="text-align: end">
        <!-- 数据来自 <strong id="updateTime">-</strong> -->

        <div class="" style="">
          数据来自 <strong id="updateTime">-</strong>
          <span id="cacheStatus">--</span>
          | <span id="cacheTTL">--</span>
        </div>
      </div>
    </div>
    <header class="header">
      <div class="header-right">
        <form id="searchForm">
          <button
            type="submit"
            title="Take a dive into →"
            id="searchBtn"
            style=""
          >
            🤿
          </button>

          <input
            type="number"
            id="limitInput"
            placeholder="Count"
            title="npm Package Count"
            min="1"
            max="30"
          />

          Latest
          <img
            src="https://static-production.npmjs.com/b9db67253aa3e3ba02f29947a75f0e49.png"
            alt="npm"
            style="width: 1.8rem; border-radius: 22%"
          />
          Packages by

          <input
            type="text"
            id="usernameInput"
            placeholder="npm username"
            title="npm username"
            value=""
          />
        </form>

        <simple-counter id="settings"></simple-counter>

        <!-- <span class="" id="statusBadge"></span> -->
      </div>
    </header>

    <!-- ===== STATS BAR ===== -->
    <h2 class="stats-bar" id="statsBar">
      <!-- ===== SORT INFO ===== -->
      <div
        class="sort-info"
        id="sortInfo"
        style="
          font-size: 0.85em;
          color: #8b949e;
          /* margin: -4px 16px 8px; */
          padding: 0;
          display: flex;
          align-items: center;
          gap: 6px;
        "
      >
        <span class="text-primary" style="font-size: 120%">Ta</span>

        <img
          id="sortAvatar"
          hidden
          alt=""
          style="
            width: calc(28 / 16 * 1rem);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
          "
        />
        <span title="按包活跃度排序：npm 近期发布">最近在忙着开发什么？</span>
      </div>
      <!-- <span class="stat-item">📦 包数 <strong id="pkgCount">-</strong></span> -->
      <!-- <span class="stat-item">📥 周总下载 <strong id="totalDownloads">-</strong></span> -->
      <span class="stat-item">
        <!-- <div>
          <span style="font-size: 0.85em" title="最热包">🔥</span>
        </div> -->
        <section id="hottestPkg">-</section>
      </span>
      <span class="stat-item" title="势头最猛：当前增速最快包">
        <!-- <span style="font-size: 0.85em">🚀</span> -->
        <strong id="hottestTrendPkg" style="display: flex; align-items: center"
          >-</strong
        >
      </span>
    </h2>

    <!-- ===== GRID ===== -->
    <div class="grid" id="grid">
      <div class="no-results">
        <span class="big">🐿️</span>
        输入 npm 用户名，让 marmot 帮你查看最近发布的包
      </div>
    </div>

    <!-- ============================================================ -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
