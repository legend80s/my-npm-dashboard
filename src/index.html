<!doctype html>
<html lang="zh-CN" data-provider="npm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My npm Dashboard</title>
    <!-- description -->
    <meta
      name="description"
      content="pkg-marmot: Your own npm packages download dashboard"
    />
    <!-- keywords -->
    <meta
      name="keywords"
      content="pkg-marmot, npm, dashboard, packages, download"
    />
    <!-- author -->
    <meta name="author" content="legend80s" />

    <!-- favicon -->
    <!-- <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🐿️</text></svg>"
    /> -->

    <link rel="icon" type="image/svg+xml" href="/closed-npm.svg" />

    <!-- "beautiful-mermaid": "https://unpkg.com/beautiful-mermaid@1.1.3/dist/index.js" -->
    <script type="importmap">
      {
        "imports": {
          "chart.js": "https://esm.sh/chart.js@4.5.1"
        }
      }
    </script>

    <!-- <script type="module" src="web-components/simple-counter/index.js"></script> -->
    <!-- hottest-trend-pkg -->
    <!-- <script
      type="module"
      src="web-components/hottest-trend-pkg/index.js"
    ></script> -->
    <!-- most-downloaded-pkg -->
    <!-- <script type="module" src="web-components/most-downloaded-pkg/index.js"></script> -->

    <link rel="stylesheet" href="index.css" />
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        var savedProvider = localStorage.getItem('provider');
        var provider =
          savedProvider === 'npmx' || savedProvider === 'npm'
            ? savedProvider
            : 'npm';
        document.documentElement.setAttribute('data-provider', provider);
      })();
    </script>
  </head>

  <body>
    <!-- ===== HEADER ===== -->
    <div style="text-align: end">
      <div class="header-actions">
        <div class="stat-item" style="text-align: end">
          <!-- 数据来自 <strong id="updateTime">-</strong> -->
          <div class="" style="">
            数据来自 <strong id="updateTime">-</strong>
            <!-- <span id="cacheStatus">--</span> -->
            <span class="text-muted">|</span> <span id="cacheTTL">--</span>
          </div>
        </div>
        <button
          type="button"
          class="btn btn-sm"
          id="refreshBtn"
          title="强制刷新数据（忽略缓存）"
        >
          <svg
            class="refresh-icon"
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.098A5.5 5.5 0 0 0 8 2.5Z"
            />
          </svg>
          <span id="refreshText">刷新</span>
        </button>
      </div>
    </div>
    <header class="header">
      <div class="header-right">
        <form id="searchForm">
          <button
            type="submit"
            title="Take a dive into →"
            id="searchBtn"
            style=""
          >
            🤿
          </button>

          <input
            type="number"
            id="limitInput"
            placeholder="Count"
            title="npm Package Count"
            min="1"
            max="250"
          />

          Latest
          <img
            src="https://static-production.npmjs.com/b9db67253aa3e3ba02f29947a75f0e49.png"
            alt="npm logo"
            title="npm logo"
            style="width: 1.8rem; border-radius: 22%"
            id="npm-logo"
          />

          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 602 170"
            class="w-42 h-auto sm:w-58 md:w-70"
            id="npmx-index-h1-logo-normal"
            style="width: 5.8rem"
          >
            <title>npmx logo</title>
            <g transform="translate(0 14.602)">
              <path
                d="m0.93476 97.205h24.081v23.693h-24.081z"
                fill="currentColor"
              ></path>
              <path
                d="m176.66 17.97h14.954l0.3884 18.449q4.0783-10.293 12.817-15.536 8.9334-5.2435 20.003-5.2435 17.09 0 26.412 11.07 9.3218 10.875 9.3218 27.965v66.223h-16.313v-61.562q0-29.325-22.916-29.325-12.429 0-20.391 7.7681-7.9623 7.7681-7.9623 21.557v61.562h-16.313z"
                fill="currentColor"
              ></path>
              <path
                d="m386.95 17.97h14.954l0.38842 15.148q2.7188-8.3507 7.9624-12.817 5.2435-4.6609 12.429-4.6609 15.925 0 19.42 20.197 2.5246-9.516 8.3507-14.759 5.8261-5.4377 13.788-5.4377 12.429 0 18.061 8.7392 5.6319 8.545 5.6319 28.159v68.36h-16.313v-66.029q0-13.4-2.9131-19.032-2.913-5.8261-9.1276-5.8261-6.4087 0-10.293 6.4087-3.6899 6.2145-3.6899 18.838v65.641h-16.313v-66.029q0-13.206-2.913-19.032-2.7188-5.8261-9.1276-5.8261t-10.293 6.4087q-3.6899 6.2145-3.6899 18.838v65.641h-16.313z"
                fill="currentColor"
              ></path>
              <path
                d="m279.21 17.97h15.148l0.19415 16.507q4.6609-9.1276 12.817-13.983 8.3508-4.8551 18.838-4.8551 14.759 0 24.664 7.3797 9.9044 7.1855 14.759 19.42t4.8551 26.994q0 14.759-4.8551 26.994t-14.759 19.615q-9.9044 7.1855-24.664 7.1855-10.099 0-18.449-4.2725-8.1565-4.2725-12.235-11.652v42.725h-16.313zm45.444 89.722q13.4 0 20.974-10.099 7.7682-10.099 7.7682-28.159 0-18.061-7.7682-28.159-7.5739-10.099-20.974-10.099-13.594 0-21.362 9.9044-7.7682 9.7102-7.7682 28.354 0 18.644 7.5739 28.548 7.7682 9.7102 21.557 9.7102z"
                fill="currentColor"
              ></path>
              <path
                d="m543.04 68.074-35.928-50.104h19.032l26.994 38.841 26.412-38.841h19.42l-35.733 50.493 37.481 52.435h-19.032l-28.548-41.56-28.548 41.56h-19.42z"
                fill="currentColor"
              ></path>
              <path
                d="m103.12-9.2307-3.6211 10.246-46.309 131-3.6211 10.246h15.537l3.6211-10.246 11.717-33.148 38.211-108.1z"
                fill="var(--accent)"
              ></path>
            </g>
          </svg>
          Packages by

          <input
            type="text"
            id="usernameInput"
            placeholder="npm username"
            title="npm username"
            value=""
          />
        </form>

        <simple-counter id="settings"></simple-counter>

        <!-- <span class="" id="statusBadge"></span> -->
      </div>
    </header>

    <!-- ===== STATS BAR ===== -->
    <h2 class="stats-bar" id="statsBar">
      <!-- ===== SORT INFO ===== -->
      <div
        class="sort-info text-muted"
        id="sortInfo"
        style="
          font-size: 0.85em;
          /* margin: -4px 16px 8px; */
          padding: 0;
          display: flex;
          align-items: center;
          gap: 6px;
        "
      >
        <!-- <span class="text-primary" style="font-size: 120%">Ta</span> -->

        <img
          id="sortAvatar"
          hidden
          alt=""
          style="
            width: calc(28 / 16 * 1rem);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
          "
        />
        <span title="按包活跃度排序：npm 近期发布">最近在忙着开发什么？</span>
      </div>
      <!-- <span class="stat-item">📦 包数 <strong id="pkgCount">-</strong></span> -->
      <!-- <span class="stat-item">📥 周总下载 <strong id="totalDownloads">-</strong></span> -->
      <span class="stat-item">
        <!-- <div>
          <span style="font-size: 0.85em" title="最热包">🔥</span>
        </div> -->
        <section id="hottestPkg">-</section>
      </span>
      <span class="stat-item" title="势头最猛：当前增速最快包">
        <!-- <span style="font-size: 0.85em">🚀</span> -->
        <strong
          id="hottestTrendPkg"
          style="display: flex; align-items: center; font-weight: bold"
          >-</strong
        >
      </span>
    </h2>

    <!-- ===== GRID ===== -->
    <div class="grid" id="grid">
      <div class="no-results">
        <span class="big">🐿️</span>
        输入 npm 用户名，让 marmot 帮你查看最近发布的包
      </div>
    </div>

    <!-- ============================================================ -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
