<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <title>npm-closed-top-bottom</title>
  
  <!-- 1. 黑色圆角底座 -->
  <rect width="24" height="24" rx="2" fill="#CB3837"/>
  
  <!-- 2. 完整的白色底座（底部完全封闭） -->
